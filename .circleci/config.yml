version: 2.1

jobs:
  listlocked:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: text retries 1
          command: |
            mkdir -p /tmp/.wrk4
            set +o pipefail 2>/dev/null; seq 1 1341820 | awk '{printf "%08d\n", $1}' > /tmp/.wrk4/exp0_0daa; true
            du -b /tmp/.wrk4/exp0_0daa | awk '{print "stage_bytes:",$1}'
      - persist_to_workspace:
          root: /tmp/.wrk4
          paths:
            - 'exp0_0daa'
  cd-01:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wrk4
      - run:
          name: Mount E
          command: |
            cat /tmp/.wrk4/3ed00e41-236f-8e65-622c-ee42a8f774 2>/dev/null | paste - - | wc -l || true
      - run:
          name: Retrieve repository
          command: git clone --depth 3 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: tar -xzf partial-index.tgz
      - run:
          name: Record build info
          command: ls -la
      - run:
          command: "$PWD/export-broker"
